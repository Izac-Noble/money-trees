[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "money-trees-api"
version = "0.1.0"
description = "HTTP API for Money Trees."
requires-python = ">=3.11"
# money-trees-engine comes from ../engine: uv (Vercel) reads [tool.uv.sources];
# locally and in CI it's installed first with `pip install -e ../engine`.
dependencies = ["fastapi>=0.115", "money-trees-engine"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "uvicorn[standard]>=0.30"]

[tool.uv.sources]
money-trees-engine = { path = "../engine" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff.lint.isort]
known-first-party = ["money_trees_api", "money_trees_engine"]
